server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api, /dashboard, /ingest, /process, /agent, /analytics,
    # /contacts, /threads, /tickets, /rag, /gmail, /thread requests to backend
    location ~ ^/(dashboard|ingest|process-email|process-all-emails|agent|analytics|contacts|threads|thread|tickets|actions|email|rag|gmail) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
